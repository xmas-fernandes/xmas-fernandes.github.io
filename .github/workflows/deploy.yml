name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A25EAE: ${{ secrets.A25EAE }}
          B8F44A: ${{ secrets.B8F44A }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A25EAE', '')
          meta_b = os.environ.get('B8F44A', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- aedc58dfb6a63721aa89136ded851c75 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- c7eb1b4958233d94086d3b -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
